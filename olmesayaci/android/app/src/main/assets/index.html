<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0c12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ölme Sayacı</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0a0c12;--s1:#11151e;--s2:#171c28;--s3:#1f2636;--ln:#262d3f;--tx:#eef0f6;--mu:#8e97ad;--cy:#25f4ee;--pk:#fe2c55;--ok:#2ee59d;--wa:#ffb84d;--bad:#ff5c7a;--g:linear-gradient(135deg,#25f4ee,#fe2c55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(900px 500px at 90% -10%,#1d1033 0,transparent 60%),radial-gradient(700px 420px at -10% 105%,#062a30 0,transparent 55%),var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
.app{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--g);display:grid;place-items:center;font-weight:800;font-size:21px;color:#fff;box-shadow:0 6px 22px rgba(254,44,85,.3)}
.brand b{font-size:18px;display:block;line-height:1.15}
.brand small{color:var(--mu);font-size:12px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#59627a;display:inline-block}
.st-connected .dot{background:var(--ok);box-shadow:0 0 0 3px rgba(46,229,157,.16)}
.st-connecting .dot,.st-retrying .dot{background:var(--wa);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.icon{width:42px;height:42px;border-radius:12px;border:1px solid var(--ln);background:var(--s1);font-size:20px;cursor:pointer}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:18px;padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--mu);font-weight:600;letter-spacing:.3px}
.conn label{display:block;font-size:12.5px;color:var(--mu);font-weight:600;margin-bottom:7px}
.row{display:flex;gap:8px}
input[type=text],input[type=number],input[type=password]{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:12px 13px;outline:none;min-width:0}
input:focus{border-color:var(--cy);box-shadow:0 0 0 3px rgba(37,244,238,.13)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--s3);cursor:pointer;white-space:nowrap;transition:transform .08s}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--g);color:#071018}
.btn.stop{background:rgba(255,92,122,.16);color:var(--bad)}
.btn.ghost{background:none;border:1px solid var(--ln);color:var(--mu)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.hint{color:var(--mu);font-size:12.5px;margin:8px 0 0}.hint.bad{color:var(--bad)}
.counter{border-radius:26px;padding:22px 12px 18px;text-align:center;margin-bottom:14px;border:1px solid var(--ln);background:var(--s1);position:relative;overflow:hidden}
.counter::before{content:"";position:absolute;inset:0;opacity:.0;transition:opacity .4s;background:radial-gradient(closest-side,var(--glow),transparent)}
.counter.pos{--glow:rgba(254,44,85,.30)}.counter.neg{--glow:rgba(37,244,238,.28)}
.counter.pos::before,.counter.neg::before{opacity:1}
.counter .lab{font-size:17px;font-weight:800;letter-spacing:5px;color:var(--mu);position:relative}
.counter.pos .lab{color:#ff7d96}.counter.neg .lab{color:var(--cy)}
.counter .num{font-size:clamp(100px,38vw,190px);line-height:1;font-weight:800;margin:6px 0 4px;position:relative;font-variant-numeric:tabular-nums}
.counter.pos .num{color:#fff;text-shadow:0 0 40px rgba(254,44,85,.55)}
.counter.neg .num{color:#fff;text-shadow:0 0 40px rgba(37,244,238,.5)}
.counter .sub{color:var(--mu);font-size:13px;position:relative}
.bump{animation:bump .32s}
@keyframes bump{40%{transform:scale(1.12)}}
.flash-pos{animation:fp .7s}.flash-neg{animation:fn .7s}
@keyframes fp{0%{box-shadow:0 0 0 0 rgba(254,44,85,.7)}100%{box-shadow:0 0 0 16px rgba(254,44,85,0)}}
@keyframes fn{0%{box-shadow:0 0 0 0 rgba(37,244,238,.7)}100%{box-shadow:0 0 0 16px rgba(37,244,238,0)}}
.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.ctrls .big{font-size:22px;padding:15px}
.ctrls .btn.wide{grid-column:span 1}
.ev{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--ln)}
.ev:last-child{border:0}
.thumb{width:38px;height:38px;border-radius:11px;background:var(--s3);display:grid;place-items:center;font-size:20px;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:contain}
.ev .who{flex:1;min-width:0}
.ev .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .who span{color:var(--mu);font-size:12.5px}
.dl{font-weight:800;font-size:17px;min-width:44px;text-align:right}
.dl.p{color:#ff7d96}.dl.m{color:var(--cy)}.ev.skip{opacity:.55}.ev.skip .dl{font-size:11.5px;font-weight:500;color:var(--mu)}
.empty{color:var(--mu);text-align:center;padding:18px 6px;font-size:13.5px}
.over{position:fixed;inset:0;background:rgba(3,5,9,.72);backdrop-filter:blur(3px);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.over.mid{align-items:center;padding:20px}
.sheet{background:var(--s1);border:1px solid var(--ln);border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom));animation:up .22s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px;position:sticky;top:0;background:var(--s1);z-index:1}
.sh h2{margin:0;font-size:19px}
.sbody{padding:4px 18px 8px;display:grid;gap:16px}
.sec h4{margin:0 0 8px;font-size:12.5px;color:var(--mu);font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.f{display:grid;gap:6px;margin-bottom:10px}.f>span{font-size:12.5px;color:var(--mu);font-weight:600}
.rule{display:grid;grid-template-columns:1fr 78px auto;gap:8px;margin-bottom:8px;align-items:center}
.x{border:0;background:none;color:var(--mu);font-size:20px;padding:6px 10px;border-radius:10px;cursor:pointer}
.x:active{background:rgba(255,92,122,.16);color:var(--bad)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;position:relative;cursor:pointer}
.switch input{position:absolute;opacity:0;right:0;width:46px;height:26px;margin:0}
.switch i{width:46px;height:26px;border-radius:999px;background:var(--s3);position:relative;transition:.2s;flex:none}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#aab2c8;transition:.2s}
.switch input:checked+i{background:var(--g)}
.switch input:checked+i::after{left:23px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--s3);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--mu)}
pre.raw{background:#07090d;border:1px solid var(--ln);border-radius:12px;padding:10px;max-height:180px;overflow:auto;font:11.5px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-all;margin:8px 0 0;color:#9fb0c8}
.dlg{background:var(--s1);border:1px solid var(--ln);border-radius:20px;padding:20px;width:min(380px,100%);animation:up .2s}
.dlg p{margin:0 0 16px;font-size:16px}.dlg .row{justify-content:flex-end}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top));display:grid;gap:8px;z-index:50;width:min(92vw,420px)}
.toast{background:var(--s3);border:1px solid var(--ln);border-left:3px solid var(--cy);border-radius:12px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:up .2s}
.toast.bad{border-left-color:var(--bad)}.toast.ok{border-left-color:var(--ok)}.toast.out{opacity:0;transition:.4s}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><div class="logo">Ö</div><div><b>Ölme Sayacı</b><small id="st" class="st-idle"><i class="dot"></i><span id="stxt">Bağlı değil</span></small></div></div>
    <button class="icon" id="btn-set" aria-label="Ayarlar">⚙</button>
  </header>

  <section class="card conn">
    <label for="link">TikTok yayın linki</label>
    <div class="row"><input id="link" type="text" inputmode="url" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="https://www.tiktok.com/@kullanici/live"><button class="btn pri" id="go">Bağlan</button></div>
    <p class="hint" id="ctxt">Yayın linkini veya @kullanıcıadı yaz, Bağlan'a bas.</p>
  </section>

  <section class="counter" id="counter">
    <div class="lab" id="lab">ÖLME</div>
    <div class="num" id="num">0</div>
    <div class="sub" id="sub"></div>
  </section>

  <section class="ctrls">
    <button class="btn big" id="dec">−1</button>
    <button class="btn big" id="inc">+1</button>
    <button class="btn" id="undo">↶ Geri al</button>
    <button class="btn ghost" id="reset">Sıfırla</button>
  </section>

  <section class="card"><h3>Olaylar</h3><div id="feed"></div></section>
</div>
<div id="sheet-root"></div>
<div id="dlg-root"></div>
<div id="toasts"></div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s);};
function h(tag,a){
  var e=document.createElement(tag);
  if(a)for(var k in a){var v=a[k];
    if(k==='class')e.className=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(k==='value')e.value=v;
    else if(k==='checked')e.checked=!!v;
    else if(v!==false&&v!=null)e.setAttribute(k,v);}
  for(var i=2;i<arguments.length;i++){var c=arguments[i];
    (Array.isArray(c)?c:[c]).forEach(function(x){if(x==null||x===false)return;e.append(x.nodeType?x:document.createTextNode(String(x)));});}
  return e;
}

/* ---------------- durum ---------------- */
var LS='olmesayaci.v1';
var DEF={link:'',apiKey:'',providerUrl:'wss://ws.eulerstream.com?uniqueId={uniqueId}&apiKey={apiKey}',
  rules:[{names:'Rose, Gül, Gul',delta:1},{names:'TikTok',delta:-1}],
  labels:{pos:'ÖLME',neg:'KORUMA'},wake:true,vibrate:true,sound:false,raw:false,auto:true};
var S;
function clone(o){return JSON.parse(JSON.stringify(o));}
function load(){
  var o=null;try{o=JSON.parse(localStorage.getItem(LS)||'null');}catch(e){}
  if(!o||typeof o!=='object')o={};
  S={live:!!o.live,count:Number.isFinite(o.count)?Math.trunc(o.count):0,history:Array.isArray(o.history)?o.history.slice(0,200):[],seen:(o.seen&&typeof o.seen==='object')?o.seen:{},cfg:Object.assign(clone(DEF),o.cfg||{})};
  S.cfg.labels=Object.assign({},DEF.labels,(o.cfg&&o.cfg.labels)||{});
  if(!Array.isArray(S.cfg.rules))S.cfg.rules=clone(DEF.rules);
}
var saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(flush,200);}
function flush(){clearTimeout(saveT);try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
window.addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',function(){if(document.hidden)flush();});
load();

/* ---------------- hediye ayrıştırma (sağlayıcı biçimleri farklı olabilir) ---------------- */
function find(o,path){
  var cur=o,parts=path.split('.');
  for(var i=0;i<parts.length;i++){
    if(cur==null)return undefined;
    if(Array.isArray(cur)){var n=Number(parts[i]);if(!Number.isInteger(n))return undefined;cur=cur[n];}
    else if(typeof cur==='object'){if(!Object.prototype.hasOwnProperty.call(cur,parts[i]))return undefined;cur=cur[parts[i]];}
    else return undefined;
  }
  return cur;
}
function pickScalar(o,paths){
  for(var i=0;i<paths.length;i++){var v=find(o,paths[i]);
    if(v!==undefined&&v!==null&&typeof v!=='object'&&v!=='')return v;}
  return undefined;
}
var IMG_PATHS=['giftPictureUrl','gift.giftPictureUrl','giftDetails.giftImage.giftPictureUrl','giftDetails.giftImage.urlList.0','giftDetails.giftImage.url_list.0','giftDetails.image.urlList.0','giftDetails.image.url_list.0','giftDetails.icon.urlList.0','giftDetails.icon.url_list.0','gift.image.urlList.0','gift.image.url_list.0','gift.icon.urlList.0','gift.icon.url_list.0','gift.imageUrl','gift.image_url','gift.image','gift.icon','image.urlList.0','image.url_list.0','icon.urlList.0','icon.url_list.0','image.url','icon.url','imageUrl','image_url','iconUrl','icon_url'];
function giftImage(p){
  for(var i=0;i<IMG_PATHS.length;i++){var v=find(p,IMG_PATHS[i]);
    if(typeof v==='string'&&v.length<600&&v.indexOf('https://')===0)return v;}
  return '';
}
function truthy(v){if(typeof v==='boolean')return v;if(typeof v==='number')return v!==0;if(typeof v==='string')return v==='true'||v==='1';return false;}
function normType(s){return String(s).toLowerCase().replace(/[^a-z0-9]/g,'');}
var GIFT_TYPES={gift:1,webcastgiftmessage:1,giftmessage:1};
function extractGifts(root,out,depth){
  depth=depth||0;
  if(depth>4||root==null)return;
  if(Array.isArray(root)){root.forEach(function(e){extractGifts(e,out,depth+1);});return;}
  if(typeof root!=='object')return;
  if(Array.isArray(root.messages)){root.messages.forEach(function(e){extractGifts(e,out,depth+1);});return;}
  var t=pickScalar(root,['type','event','eventType','msgType','method']);
  if(t===undefined||!GIFT_TYPES[normType(t)])return;
  var p=(root.data&&typeof root.data==='object'&&!Array.isArray(root.data))?root.data:root;
  var g={user:'',nick:'',name:'',id:0,count:1,ended:false,image:''},v;
  v=pickScalar(p,['user.uniqueId','uniqueId','user.unique_id','user.nickname','nickname','userId']);if(v!==undefined)g.user=String(v);
  v=pickScalar(p,['user.nickname','nickname']);if(v!==undefined)g.nick=String(v);
  if(!g.nick)g.nick=g.user;if(!g.user)g.user=g.nick;
  v=pickScalar(p,['giftName','gift.name','gift.giftName','giftDetails.giftName','giftDetails.name','gift_name','name']);if(v!==undefined)g.name=String(v);
  if(!g.name&&typeof p.gift==='string')g.name=p.gift;
  v=pickScalar(p,['giftId','gift.id','gift.giftId','giftDetails.id','giftDetails.giftId','gift_id']);if(v!==undefined)g.id=Math.trunc(Number(v))||0;
  if(!g.name&&g.id)g.name='gift_'+g.id;
  if(!g.name)return;
  v=pickScalar(p,['repeatCount','gift.repeatCount','repeat_count','gift.repeat_count','giftCount','count']);
  if(v!==undefined){var c=Math.trunc(Number(v));g.count=Number.isFinite(c)?Math.min(1000000,Math.max(1,c)):1;}
  var streaking=pickScalar(p,['streaking','isStreaking']),rend=pickScalar(p,['repeatEnd','repeat_end','gift.repeatEnd','streakEnd']),gt=pickScalar(p,['giftType','gift.giftType','giftDetails.giftType','gift_type']);
  if(streaking!==undefined)g.ended=!truthy(streaking);else if(rend!==undefined)g.ended=truthy(rend);
  if(gt!==undefined&&Number.isFinite(Number(gt))&&Number(gt)!==1)g.ended=true;
  g.image=giftImage(p);
  out.push(g);
}
/* Seri hediyelerde (1,2,3...) sadece yeni eklenen adedi say */
var streaks={},STREAK_MS=10000;
function consume(g,now){
  now=now||Date.now();
  Object.keys(streaks).forEach(function(k){if(now-streaks[k].seen>STREAK_MS)delete streaks[k];});
  var key=g.user+'\x1f'+(g.id||g.name),r=Math.max(1,g.count),n=r,st=streaks[key];
  if(st){if(r>st.last)n=r-st.last;else if(r===st.last&&g.ended)n=0;}
  if(g.ended)delete streaks[key];else streaks[key]={last:r,seen:now};
  return n;
}
function matchRule(g){
  var nm=g.name.toLowerCase();
  for(var i=0;i<S.cfg.rules.length;i++){
    var toks=String(S.cfg.rules[i].names||'').split(',').map(function(x){return x.trim().toLowerCase();}).filter(Boolean);
    if(toks.indexOf(nm)>=0||(g.id&&toks.indexOf(String(g.id))>=0))return S.cfg.rules[i];
  }
  return null;
}

/* ---------------- sayaç ---------------- */
var EMOJI={rose:'🌹','gül':'🌹',gul:'🌹',tiktok:'🎵'};
function emojiFor(n){return EMOJI[String(n||'').toLowerCase()]||'🎁';}
function clockOf(t){return new Date(t).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
function toast(msg,kind){
  var t=h('div',{class:'toast '+(kind||'')},msg);$('#toasts').append(t);
  setTimeout(function(){t.classList.add('out');},2600);setTimeout(function(){t.remove();},3200);
}
var audio=null;
function beep(up){
  if(!S.cfg.sound)return;
  try{
    audio=audio||new (window.AudioContext||window.webkitAudioContext)();
    var o=audio.createOscillator(),g=audio.createGain();
    o.frequency.value=up?660:330;g.gain.value=.08;o.connect(g);g.connect(audio.destination);
    o.start();o.stop(audio.currentTime+.12);
  }catch(e){}
}
function apply(delta,meta){
  S.count+=delta;
  S.history.unshift({t:Date.now(),user:meta.user,gift:meta.gift,n:meta.n,delta:delta,total:S.count,img:meta.img||''});
  if(S.history.length>200)S.history.length=200;
  save();render();renderFeed();
  var c=$('#counter');c.classList.remove('flash-pos','flash-neg');void c.offsetWidth;c.classList.add(delta>0?'flash-pos':'flash-neg');
  var n=$('#num');n.classList.remove('bump');void n.offsetWidth;n.classList.add('bump');
  if(S.cfg.vibrate&&navigator.vibrate){try{navigator.vibrate(delta>0?[35]:[20,40,20]);}catch(e){}}
  beep(delta>0);
}
function note(g,skip){
  var s=S.seen[g.name]||(S.seen[g.name]={n:0,id:g.id});
  s.n+=1;s.t=Date.now();if(g.id)s.id=g.id;
  var keys=Object.keys(S.seen);
  if(keys.length>60){keys.sort(function(a,b){return S.seen[a].t-S.seen[b].t;});delete S.seen[keys[0]];}
}
function onGift(g){
  var n=consume(g);
  if(n<=0)return;
  note(g);
  var rule=matchRule(g),d=rule?Math.trunc(Number(rule.delta))||0:0;
  if(!d){
    S.history.unshift({t:Date.now(),user:g.user,gift:g.name,n:n,delta:0,total:S.count,img:g.image});
    if(S.history.length>200)S.history.length=200;
    save();renderFeed();return;
  }
  apply(d*n,{user:g.user,gift:g.name,n:n,img:g.image});
}
var rawLines=[];
function onData(txt){
  if(S.cfg.raw){rawLines.unshift(String(txt).slice(0,600));if(rawLines.length>30)rawLines.length=30;var pre=$('#raw');if(pre)pre.textContent=rawLines.join('\n\n');}
  var j;try{j=JSON.parse(txt);}catch(e){return;}
  var gs=[];extractGifts(j,gs);gs.forEach(onGift);
}
function undo(){
  for(var i=0;i<S.history.length;i++){
    if(S.history[i].delta){
      var e=S.history.splice(i,1)[0];
      S.count-=e.delta;save();render();renderFeed();toast('Geri alındı: '+(e.delta>0?'+':'−')+Math.abs(e.delta),'ok');return;
    }
  }
  toast('Geri alınacak bir şey yok');
}
function manual(d){apply(d,{user:'elle',gift:'(elle)',n:1,img:''});}

/* ---------------- ekran ---------------- */
function render(){
  var c=S.count,neg=c<0,L=S.cfg.labels;
  $('#num').textContent=Math.abs(c);
  $('#lab').textContent=neg?L.neg:L.pos;
  $('#counter').className='counter '+(neg?'neg':(c>0?'pos':'zero'));
  $('#sub').textContent=L.pos.toLocaleLowerCase('tr')+' '+Math.max(c,0)+' · '+L.neg.toLocaleLowerCase('tr')+' '+Math.max(-c,0);
}
function renderFeed(){
  var box=$('#feed');box.replaceChildren();
  if(!S.history.length){box.append(h('div',{class:'empty'},'Henüz olay yok. Bağlanınca gelen gül ve TikTok hediyeleri burada görünür.'));return;}
  S.history.slice(0,40).forEach(function(e){
    var th=h('div',{class:'thumb'});
    if(e.img&&String(e.img).indexOf('https://')===0){
      var im=h('img',{src:e.img,alt:'',loading:'lazy',referrerpolicy:'no-referrer'});
      im.addEventListener('error',function(){th.replaceChildren(emojiFor(e.gift));});th.append(im);
    }else th.append(e.user==='elle'?'✋':emojiFor(e.gift));
    box.append(h('div',{class:'ev'+(e.delta?'':' skip')},th,
      h('div',{class:'who'},h('b',null,e.user||'—'),h('span',null,e.gift+(e.n>1?' ×'+e.n:'')+' · '+clockOf(e.t))),
      h('span',{class:'dl '+(e.delta>0?'p':(e.delta<0?'m':''))},e.delta?(e.delta>0?'+':'−')+Math.abs(e.delta):(e.reset?'sıfırlandı':'sayılmadı'))));
  });
}

/* ---------------- yayına bağlanma ---------------- */
function parseUser(s){
  s=String(s||'').trim();if(!s)return {err:'Yayın linkini veya @kullanıcıadı yaz.'};
  var m=s.match(/tiktok\.com\/@([A-Za-z0-9._]+)/i);if(m)return {user:m[1]};
  if(/^https?:\/\//i.test(s)||/tiktok\.com/i.test(s))return {err:'Kısa link (vm.tiktok.com) çözülemiyor. Yayını açıp tam linki (…/@kullanici/live) yapıştır veya sadece @kullanıcıadı yaz.'};
  m=s.match(/^@?([A-Za-z0-9._]{2,24})$/);
  return m?{user:m[1]}:{err:'Kullanıcı adı anlaşılamadı. Örnek: https://www.tiktok.com/@kullanici/live'};
}
function dropEmptyParams(url){
  var q=url.indexOf('?');if(q<0)return url;
  var base=url.slice(0,q),parts=url.slice(q+1).split('&').filter(function(p){return p&&p.slice(-1)!=='=';});
  return parts.length?base+'?'+parts.join('&'):base;
}
var ws=null,wanted=false,user='',backoff=2,retryT=null,status='idle',lastErr='',wake=null;
function setStatus(s,msg){
  status=s;
  var names={idle:'Bağlı değil',connecting:'Bağlanıyor…',connected:'Bağlı · @'+user,retrying:'Yeniden deneniyor…'};
  $('#st').className='st-'+s;$('#stxt').textContent=names[s];
  var b=$('#go');b.textContent=s==='idle'?'Bağlan':'Durdur';b.className='btn '+(s==='idle'?'pri':'stop');
  var c=$('#ctxt');
  if(msg){c.textContent=msg;c.className='hint bad';}
  else{c.className='hint';c.textContent=s==='connected'?'Hediyeler dinleniyor. Gül +1, TikTok −1.':(s==='idle'?'Yayın linkini veya @kullanıcıadı yaz, Bağlan\'a bas.':'');}
}
function buildUrl(){
  var u=S.cfg.providerUrl.replace('{uniqueId}',encodeURIComponent(user)).replace('{apiKey}',encodeURIComponent(S.cfg.apiKey||''));
  return S.cfg.apiKey?u:dropEmptyParams(u);
}
function openWs(){
  if(!wanted)return;
  clearTimeout(retryT);setStatus('connecting');
  try{ws=new WebSocket(buildUrl());}catch(e){wanted=false;setStatus('idle','Sağlayıcı adresi geçersiz: '+e.message);return;}
  var mine=ws;
  ws.onopen=function(){backoff=2;lastErr='';setStatus('connected');acquireWake();};
  ws.onmessage=function(ev){
    var d=ev.data;
    if(typeof d==='string')onData(d);
    else if(d&&d.text)d.text().then(onData);
    else if(d instanceof ArrayBuffer)onData(new TextDecoder().decode(d));
  };
  ws.onerror=function(){lastErr='Bağlantı hatası';};
  ws.onclose=function(){
    if(mine!==ws)return;
    ws=null;
    if(!wanted){setStatus('idle');return;}
    setStatus('retrying',(lastErr||'Bağlantı koptu')+' — '+backoff+' sn sonra yeniden denenecek');
    retryT=setTimeout(openWs,backoff*1000);backoff=Math.min(backoff*2,30);
  };
}
function startLive(){
  var r=parseUser($('#link').value);
  if(r.err){setStatus('idle',r.err);return;}
  user=r.user;S.cfg.link=$('#link').value.trim();S.live=true;save();
  wanted=true;backoff=2;openWs();
}
function stopLive(){
  S.live=false;save();
  wanted=false;clearTimeout(retryT);
  if(ws){var w=ws;ws=null;try{w.close();}catch(e){}}
  releaseWake();setStatus('idle');
}
function acquireWake(){
  try{if(S.cfg.wake&&wanted&&'wakeLock' in navigator&&!wake){navigator.wakeLock.request('screen').then(function(l){wake=l;l.addEventListener('release',function(){wake=null;});}).catch(function(){});}}catch(e){}
}
function releaseWake(){try{if(wake){wake.release();wake=null;}}catch(e){}}
document.addEventListener('visibilitychange',function(){
  if(document.hidden)return;
  acquireWake();
  if(wanted&&!ws){clearTimeout(retryT);backoff=2;openWs();}
});
window.addEventListener('online',function(){if(wanted&&!ws){clearTimeout(retryT);backoff=2;openWs();}});

/* ---------------- pencereler ---------------- */
function ask(text,okLabel,onOk){
  var root=$('#dlg-root');
  function close(){root.replaceChildren();}
  root.replaceChildren(h('div',{class:'over mid',onclick:function(e){if(e.target===e.currentTarget)close();}},
    h('div',{class:'dlg'},h('p',null,text),h('div',{class:'row'},h('button',{class:'btn ghost',onclick:close},'Vazgeç'),h('button',{class:'btn stop',onclick:function(){close();onOk();}},okLabel)))));
}
var sheetOpen=false;
function closeSheet(){$('#sheet-root').replaceChildren();sheetOpen=false;}
window.addEventListener('popstate',function(){if(sheetOpen)closeSheet();});
function sw(checked,on,text){
  var i=h('input',{type:'checkbox',checked:checked});i.addEventListener('change',function(){on(i.checked);});
  return h('label',{class:'switch'},h('span',null,text),i,h('i'));
}
function bind(obj,key,ph,type){
  var i=h('input',{type:type||'text',placeholder:ph||'',value:obj[key]==null?'':obj[key],autocapitalize:'off',autocomplete:'off',spellcheck:'false'});
  i.addEventListener('input',function(){obj[key]=type==='number'?(i.value===''?0:Number(i.value)):i.value;save();if(obj===S.cfg.labels)render();});
  return i;
}
function openSettings(){
  if(sheetOpen)return;
  sheetOpen=true;try{history.pushState({sheet:1},'');}catch(e){}
  var cfg=S.cfg,key=bind(cfg,'apiKey','(sağlayıcı anahtarı)','password');
  var showB=h('button',{class:'btn ghost sm',onclick:function(){key.type=key.type==='password'?'text':'password';showB.textContent=key.type==='password'?'Göster':'Gizle';}},'Göster');
  var rulesBox=h('div');
  function drawRules(){
    rulesBox.replaceChildren();
    cfg.rules.forEach(function(r,i){
      rulesBox.append(h('div',{class:'rule'},bind(r,'names','hediye adları: Rose, Gül'),bind(r,'delta','±','number'),
        h('button',{class:'x',title:'Sil',onclick:function(){cfg.rules.splice(i,1);save();drawRules();}},'✕')));
    });
    rulesBox.append(h('button',{class:'btn ghost sm',onclick:function(){cfg.rules.push({names:'',delta:1});save();drawRules();}},'+ Kural ekle'));
  }
  drawRules();
  var seenBox=h('div',{class:'chips'});
  Object.keys(S.seen).sort(function(a,b){return S.seen[b].t-S.seen[a].t;}).slice(0,30).forEach(function(n){seenBox.append(h('span',{class:'chip'},n+' ×'+S.seen[n].n));});
  if(!seenBox.childElementCount)seenBox.append(h('span',{class:'hint'},'Henüz hediye görülmedi.'));
  var pre=h('pre',{class:'raw',id:'raw'},rawLines.join('\n\n'));pre.hidden=!cfg.raw;
  function fake(name,count,id){
    var g=[{user:'test',nick:'test',name:name,id:id||0,count:count,ended:true,image:''}];
    g.forEach(onGift);
  }
  var body=h('div',{class:'sbody'},
    h('div',{class:'sec'},h('h4',null,'Bağlantı'),
      h('div',{class:'f'},h('span',null,'Sağlayıcı API anahtarı'),h('div',{class:'row'},key,showB)),
      h('div',{class:'f'},h('span',null,'Sağlayıcı adresi'),bind(cfg,'providerUrl','wss://…')),
      h('p',{class:'hint'},'TikTok resmi bir hediye API\'si sunmadığı için hediyeler bir sağlayıcıdan (ör. Euler Stream) gelir. {uniqueId} ve {apiKey} yer tutucuları kullanılabilir.')),
    h('div',{class:'sec'},h('h4',null,'Hediye kuralları'),h('p',{class:'hint',style:'margin:0 0 10px'},'Her satır: virgülle ayrılmış hediye adları (veya hediye ID) ve sayaca eklenecek değer. Üstteki önce bakılır.'),rulesBox),
    h('div',{class:'sec'},h('h4',null,'Etiketler'),
      h('div',{class:'row'},h('div',{class:'f',style:'flex:1'},h('span',null,'0 ve üstü'),bind(cfg.labels,'pos','ÖLME')),h('div',{class:'f',style:'flex:1'},h('span',null,'0\'ın altı'),bind(cfg.labels,'neg','KORUMA')))),
    h('div',{class:'sec'},h('h4',null,'Seçenekler'),
      sw(cfg.wake,function(v){cfg.wake=v;save();v?acquireWake():releaseWake();},'Bağlıyken ekranı açık tut'),
      sw(cfg.vibrate,function(v){cfg.vibrate=v;save();},'Titreşim'),
      sw(cfg.sound,function(v){cfg.sound=v;save();if(v)beep(true);},'Ses'),
      sw(cfg.auto,function(v){cfg.auto=v;save();},'Uygulama açılınca yayına otomatik bağlan (en son bağlıysan)')),
    h('div',{class:'sec'},h('h4',null,'Test (yayına gerek yok)'),
      h('div',{class:'row',style:'flex-wrap:wrap'},
        h('button',{class:'btn sm',onclick:function(){fake('Rose',1);}},'Gül gönder'),
        h('button',{class:'btn sm',onclick:function(){fake('TikTok',1);}},'TikTok gönder'),
        h('button',{class:'btn sm',onclick:function(){fake('Rose',5);}},'Gül ×5'),
        h('button',{class:'btn sm',onclick:function(){fake('TikTok',3);}},'TikTok ×3'))),
    h('div',{class:'sec'},h('h4',null,'Görülen hediyeler'),h('p',{class:'hint',style:'margin:0 0 8px'},'Kurallara yazacağın adlar burada görünen gibi olmalı.'),seenBox,
      h('div',{style:'margin-top:12px'},sw(cfg.raw,function(v){cfg.raw=v;save();pre.hidden=!v;},'Ham sağlayıcı mesajlarını göster (sorun giderme)'),pre)),
    h('div',{class:'sec'},h('h4',null,'Veri'),
      h('div',{class:'row',style:'flex-wrap:wrap'},
        h('button',{class:'btn ghost sm',onclick:function(){ask('Olay geçmişi silinsin mi? (Sayaç değişmez)','Sil',function(){S.history=[];save();renderFeed();toast('Geçmiş silindi','ok');});}},'Geçmişi sil'),
        h('button',{class:'btn ghost sm',onclick:function(){ask('Tüm ayarlar varsayılana dönsün mü?','Sıfırla',function(){S.cfg=clone(DEF);S.cfg.link=$('#link').value;save();closeSheet();render();toast('Ayarlar sıfırlandı','ok');});}},'Ayarları sıfırla'))));
  $('#sheet-root').replaceChildren(h('div',{class:'over',onclick:function(e){if(e.target===e.currentTarget)history.back();}},
    h('div',{class:'sheet'},h('div',{class:'sh'},h('h2',null,'Ayarlar'),h('button',{class:'x',onclick:function(){history.back();}},'✕')),body)));
}

/* ---------------- olaylar ---------------- */
$('#go').addEventListener('click',function(){if(status==='idle')startLive();else stopLive();});
$('#link').addEventListener('keydown',function(e){if(e.key==='Enter'&&status==='idle')startLive();});
$('#btn-set').addEventListener('click',openSettings);
$('#inc').addEventListener('click',function(){manual(1);});
$('#dec').addEventListener('click',function(){manual(-1);});
$('#undo').addEventListener('click',undo);
$('#reset').addEventListener('click',function(){ask('Sayaç 0\'a sıfırlansın mı?','Sıfırla',function(){S.count=0;S.history.unshift({t:Date.now(),user:'elle',gift:'sayaç sıfırlandı',n:1,delta:0,total:0,img:'',reset:true});save();render();renderFeed();});});
$('#link').value=S.cfg.link||'';
render();renderFeed();setStatus('idle');
/* uygulama kapanıp açıldıysa ve en son bağlıydıysa kendiliğinden bağlan */
if(S.cfg.auto&&S.live){var ar=parseUser(S.cfg.link);if(ar.user){user=ar.user;wanted=true;openWs();}}

/* ---------------- uygulama olarak kurulum (PWA) ---------------- */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
window.__olme={onData:onData,state:function(){return S;},consume:consume,extractGifts:extractGifts,parseUser:parseUser};
})();
</script>
